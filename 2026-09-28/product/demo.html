<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情绪读数原型</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1f1f1f;--mute:#6b6b6b;--line:#e4e2dc;
  --joy:#e0a526;--sadness:#3f78c9;--anger:#d2493c;--neutral:#9a9a9a;--accent:#1f1f1f}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--ink:#ececec;--mute:#9a9a9a;--line:#2e2e2e;--accent:#ececec}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:1fr 320px;gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
textarea,input{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row label{font-size:13px;color:var(--mute);white-space:nowrap}
button{font:inherit;background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#out{min-height:140px;white-space:pre-wrap;margin-top:12px}
#out span{border-radius:3px;transition:background .2s}
.bar{display:grid;grid-template-columns:48px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.fill{height:100%;width:0;transition:width .15s}
canvas{width:100%;height:120px;display:block;margin-top:10px}
.stat{font-size:12px;color:var(--mute);margin-top:8px}.pre{font-size:12px;color:var(--mute)}
svg{display:block;margin:4px auto 8px}
</style>
</head>
<body>
<main>
  <section>
    <h1>实时情绪读数</h1>
    <p class="sub">每生成一个字，读取模型内部第 <b id="layer">?</b> 层状态，推断它此刻"带着什么情绪往下说"。读数是探针估计，不代表模型有主观感受。</p>
    <div class="card">
      <textarea id="sys" placeholder="系统设定（可选），例如：你是一个毛绒玩具店的导购"></textarea>
      <textarea id="msg" style="margin-top:8px">我订的生日蛋糕被送错了，店家说今天没法重做，明天才能补送。</textarea>
      <div class="row"><label>温度</label><input id="temp" type="number" step="0.1" min="0" max="1.5" value="0.7" style="width:80px">
        <label>最长</label><input id="maxn" type="number" value="200" style="width:80px"><span style="flex:1"></span><button id="go">生成</button></div>
      <div id="out"></div>
      <canvas id="tl" width="700" height="120"></canvas>
      <div class="stat" id="stat"></div>
    </div>
  </section>
  <aside class="card">
    <svg id="face" width="160" height="160" viewBox="0 0 160 160" aria-label="表情">
      <circle cx="80" cy="80" r="70" fill="none" stroke="currentColor" stroke-width="3"/>
      <line id="bl" x1="45" y1="55" x2="68" y2="55" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line id="br" x1="92" y1="55" x2="115" y2="55" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle cx="57" cy="72" r="5" fill="currentColor"/><circle cx="103" cy="72" r="5" fill="currentColor"/>
      <path id="mouth" d="M55 112 Q80 112 105 112" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="pre" id="pre">生成前预读数：—</div>
    <div id="bars"></div>
    <div class="stat">VRM 表情权重</div>
    <pre id="vrm" style="font-size:12px;margin:4px 0 0">{}</pre>
  </aside>
</main>
<script>
const C=["anger","sadness","joy","neutral"],NAME={anger:"愤怒",sadness:"悲伤",joy:"愉悦",neutral:"中性"};
const css=k=>getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim();
const bars=document.getElementById("bars");
C.forEach(c=>bars.insertAdjacentHTML("beforeend",`<div class="bar"><span>${NAME[c]}</span><div class="track"><div class="fill" id="f_${c}" style="background:var(--${c})"></div></div><span id="v_${c}">0.00</span></div>`));
fetch("/info").then(r=>r.json()).then(j=>document.getElementById("layer").textContent=j.layer).catch(()=>{});
let hist=[];
function show(ema,vrm){C.forEach(c=>{document.getElementById("f_"+c).style.width=(ema[c]*100).toFixed(1)+"%";document.getElementById("v_"+c).textContent=ema[c].toFixed(2)});
  document.getElementById("vrm").textContent=JSON.stringify(vrm,null,1);
  const h=vrm.happy||0,s=vrm.sad||0,a=vrm.angry||0,curve=112+22*h-16*s-8*a;
  document.getElementById("mouth").setAttribute("d",`M55 112 Q80 ${curve.toFixed(1)} 105 112`);
  const tilt=14*a-10*s;document.getElementById("bl").setAttribute("y2",(55+tilt).toFixed(1));document.getElementById("br").setAttribute("y1",(55+tilt).toFixed(1));}
function draw(){const cv=document.getElementById("tl"),g=cv.getContext("2d"),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);
  if(hist.length<2)return;C.forEach(c=>{g.strokeStyle=css(c);g.lineWidth=2;g.beginPath();hist.forEach((p,i)=>{const x=i/(hist.length-1)*W,y=H-4-p[c]*(H-8);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()});}
document.getElementById("go").onclick=()=>{
  const out=document.getElementById("out"),btn=document.getElementById("go");out.textContent="";hist=[];draw();btn.disabled=true;
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>ws.send(JSON.stringify({system:document.getElementById("sys").value||undefined,messages:[{role:"user",content:document.getElementById("msg").value}],
    temperature:+document.getElementById("temp").value,max_new_tokens:+document.getElementById("maxn").value}));
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==="pre"){document.getElementById("pre").textContent=(m.calibrated?"生成前预读（预测接下来的语气）：":"生成前预读数（未校准，仅供参考）：")+C.map(c=>NAME[c]+" "+m.probs[c].toFixed(2)).join(" · ");if(m.calibrated){show(m.probs,m.vrm);hist.push(m.probs);draw()}}
    if(m.type==="token"){if(!m.text&&hist.length)return;const top=C.filter(c=>c!=="neutral").reduce((a,b)=>m.probs[a]>m.probs[b]?a:b),sp=document.createElement("span");
      sp.textContent=m.text;const w=Math.max(0,m.probs[top]-0.25);sp.style.background=w>0?css(top)+Math.round(Math.min(1,w*1.6)*90).toString(16).padStart(2,"0"):"transparent";
      sp.title=C.map(c=>NAME[c]+" "+m.probs[c].toFixed(2)).join("\n");out.appendChild(sp);hist.push(m.ema);show(m.ema,m.vrm);draw()}
    if(m.type==="done"){document.getElementById("stat").textContent=`${m.stats.tokens} tokens · ${m.stats.tok_per_s} tok/s · 首字 ${m.stats.first_token_s}s`;btn.disabled=false;ws.close()}};
  ws.onerror=()=>{btn.disabled=false;document.getElementById("stat").textContent="连接失败"}};
</script>
</body>
</html>
