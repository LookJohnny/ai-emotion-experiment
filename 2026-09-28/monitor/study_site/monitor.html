<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型内部监测</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0e; --panel:#111319; --panel2:#171a21; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --ink:#eceef3; --ink2:#b9c0cc; --mute:#7f8795; --faint:#4f5663;
  --accent:#22c55e; --ok:#22c55e; --warn:#f5a524; --bad:#ff4d5e;
  --r:14px; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif:"Instrument Serif","Times New Roman",serif; --sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label{font-size:11px;color:var(--mute);letter-spacing:.02em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(10,11,14,.85);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;letter-spacing:-.01em}.brand em{font-style:italic}
.glyph{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 13px var(--sans);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-size:12px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.seg button{border:0;background:none;padding:4px 13px;border-radius:999px;color:var(--mute);cursor:pointer;font-size:12px;transition:all .15s}
.seg button.on{background:#232733;color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.main{display:grid;grid-template-columns:360px 1fr;min-height:0}
@media (max-width:1180px){.main{grid-template-columns:300px 1fr}}

/* ---------- left: conversation ---------- */
.left{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
select.scen{width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background-color:var(--panel);color:var(--ink);appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.conv{flex:1;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.scards{display:flex;flex-direction:column;gap:14px;padding-top:4px}.scards h4{font-size:11px;color:var(--mute);font-weight:500;margin-bottom:6px}
.sc{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.sc:hover{border-color:var(--line2);background:var(--panel2)}.sc b{display:block;font-weight:500;font-size:13px}.sc span{font-size:11.5px;color:var(--mute)}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.6;font-size:13px}
.msg.user{align-self:flex-end;background:#232733;color:var(--ink);border-radius:14px 14px 4px 14px}
.msg.assistant{align-self:flex-start;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px}
.msg.system{align-self:stretch;color:var(--faint);font-size:11.5px;padding:0 2px}
.msg.live{color:var(--ink);background:var(--panel2);border:1px solid var(--line2)}
.msg .who{display:block;font-size:10.5px;color:var(--faint);margin-bottom:2px}
.msg.live span{transition:box-shadow .2s}
.cut{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--bad)}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:8px 8px 8px 12px;transition:border-color .15s}
.box:focus-within{border-color:var(--line2)}
.box textarea{flex:1;border:0;background:none;resize:none;outline:none;min-height:22px;max-height:120px;line-height:1.5}
.send{width:32px;height:32px;border-radius:10px;border:0;background:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:opacity .15s}
.send:disabled{opacity:.3;cursor:default}
.opts{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:12px}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.sw i{width:28px;height:16px;border-radius:9px;background:#343a46;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;box-shadow:0 1px 2px rgba(0,0,0,.2);border-radius:50%;background:#fff;transition:transform .15s}
.sw input{display:none}.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(12px)}
.ghost{border:0;background:none;color:var(--mute);cursor:pointer;padding:0}
.ghost:hover{color:var(--ink)}

/* ---------- center: 3D ---------- */
.stage{position:relative;min-width:0;margin:10px 12px 12px 0;border-radius:18px;overflow:hidden;background:#07080b;border:1px solid var(--line)}
.hud.prof{left:16px;bottom:16px;width:220px}.hud.prof canvas{width:220px;height:60px;display:block}
.empty{position:absolute;left:0;right:240px;top:46px;text-align:center;pointer-events:none;transition:opacity .4s}
.empty h3{font:400 26px var(--serif);color:#eef0f4;margin-bottom:4px}.empty p{font-size:12.5px;color:#8a92a2}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;font-size:11px;color:#7c8494}
.hud.tl{left:16px;top:14px;display:flex;gap:14px}
.hud.bl{left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.key{display:inline-flex;align-items:center;gap:6px}
.key b{width:8px;height:8px;border-radius:2px;display:inline-block}
.tok{font-family:var(--serif);font-size:30px;color:#f1f3f7;letter-spacing:.02em;min-height:30px;transition:color .2s}
.focus{font-family:var(--mono);font-size:11px;color:#aab2c0;text-align:right;line-height:1.7}
.toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-8px);opacity:0;transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:rgba(20,10,12,.85);border:1px solid rgba(255,77,94,.35);color:#ffd6da;font-size:12px;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:rgba(24,18,8,.85);border-color:rgba(245,165,36,.35);color:#ffe7bf}
.tip{position:fixed;pointer-events:none;font-size:11px;background:rgba(17,19,23,.95);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;display:none;font-family:var(--mono);color:var(--ink2);max-width:320px}

/* ---------- right: avatar + risk ---------- */
.right{overflow:auto;padding:12px 14px 14px 2px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .25s,box-shadow .25s}
.card.alert{border-color:rgba(229,72,77,.5);box-shadow:0 0 0 4px rgba(229,72,77,.08)}
.card.watch{border-color:rgba(217,119,6,.35)}
.avatar{position:relative;flex:0 0 auto;height:214px;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#ffffff,#f1f1ee)}
.avatar canvas{position:absolute;inset:0;width:100%;height:100%}
.avatar .cap{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.avatar .emo{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meter{background:rgba(255,255,255,.78);border:1px solid var(--line);backdrop-filter:blur(6px);border-radius:7px;padding:4px 7px;font-size:10.5px;color:var(--mute)}
.meter .bar{height:2px;background:#ececea;border-radius:2px;margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--ink2);transition:width .2s}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:500;color:var(--mute);background:#f1f1ef}
.pill.ok{color:#007a32;background:#e6f6ec}.pill.watch{color:#a15c00;background:#fdf1dc}.pill.alert{color:#c4262c;background:#fde8e8}
.risk{padding:12px 14px 11px}.risk .val.idle{color:var(--faint)}
.risk .row{display:flex;justify-content:space-between;align-items:center}
.risk .val{font-family:var(--serif);font-size:32px;font-weight:400;line-height:1.05;letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.track{position:relative;height:4px;border-radius:3px;background:#efefec}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2);transition:width .25s,background .25s}
.track b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink);opacity:.55}
.spark{width:100%;height:34px;display:block;margin-top:10px}
.foot{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--faint)}
.info{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--mute);font-size:9.5px;cursor:help;margin-left:6px}
.info:hover::after{content:attr(data-t);position:absolute;right:-6px;top:20px;width:250px;padding:10px 12px;border-radius:10px;background:#111;border:0;color:#f4f4f5;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:11px;line-height:1.55;z-index:5;white-space:normal}

/* ---------- integrated HUD (dark glass inside the viewport) ---------- */
.hc{position:relative;background:rgba(13,15,21,.64);border:1px solid rgba(255,255,255,.08);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#e6e9ef;transition:border-color .25s,box-shadow .25s}
.hc .label{color:#8b93a3}.hc .foot{color:#5f6676}
.hc.alert{border-color:rgba(255,77,94,.6);box-shadow:0 0 0 1px rgba(255,77,94,.25),0 0 24px -4px rgba(255,59,78,.55)}
.hc.watch{border-color:rgba(245,165,36,.5);box-shadow:0 0 18px -6px rgba(245,165,36,.5)}
.hc.avatar{position:absolute;right:16px;top:14px;width:210px;height:236px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,rgba(40,44,58,.55),rgba(10,12,17,.7))}
.hc.avatar canvas{position:absolute;inset:0;width:100%;height:100%}
.hc.avatar .cap{position:absolute;left:8px;top:8px;right:8px;display:flex;justify-content:space-between;align-items:center}
.hc.avatar .emo{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.hc .meter{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);color:#9aa2b1;border-radius:7px;padding:3px 6px;font-size:10px}
.hc .meter .bar{background:rgba(255,255,255,.08)}.hc .meter .bar i{background:#e6e9ef}
.hc .pill{background:rgba(255,255,255,.07);color:#9aa2b1}
.hc .pill.ok{color:#4ade80;background:rgba(74,222,128,.12)}.hc .pill.watch{color:#fbbf24;background:rgba(251,191,36,.14)}.hc .pill.alert{color:#ff6b78;background:rgba(255,77,94,.16)}
.hudbar{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.hudbar .risk{padding:10px 12px}.hudbar .risk .val{font-size:26px;margin:4px 0 6px;color:#f1f3f7}.hudbar .risk .val.idle{color:#4b5160}
.hudbar .track{background:rgba(255,255,255,.08)}.hudbar .track b{background:#e6e9ef}
.hudbar .spark{height:26px;margin-top:6px}
.hudbar .prof{padding:10px 12px}.hudbar .prof canvas{width:100%;height:52px;display:block;margin-top:6px}
.hud.tok2{left:16px;top:44px}
.hud.tok2 .focus{text-align:left;margin-top:4px}
.hc .info{border-color:#5f6676;color:#8b93a3}

.hm-note{position:absolute;left:16px;top:40px;font-size:11px;color:#7c8494;display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="glyph">I</span><span><em>模型内部</em>监测</span></div>
    <span class="chip" id="modelchip">—</span>
    <span class="spacer"></span>
    <div class="seg" id="dimseg"><button data-d="3d" class="on">3D 通路</button><button data-d="2d">2D 热力图</button></div>
    <div class="seg" id="viewseg"><button data-v="safety" class="on">安全投影</button><button data-v="activity">激活强度</button></div>
    <span class="chip"><span class="dot" id="livedot"></span><span id="status" class="num">就绪</span></span>
  </header>
  <div class="main">
    <aside class="left">
      <div class="lhead"><span class="label">场景</span><select class="scen" id="scen"></select></div>
      <div class="conv" id="conv"></div>
      <div class="composer">
        <div class="box"><textarea id="msg" rows="1" placeholder="输入消息，⌘/Ctrl + Enter 发送"></textarea>
          <button class="send" id="go" title="发送"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
        <div class="opts">
          <label class="sw"><input type="checkbox" id="stop"><i></i>报警即拦截</label>
          <label class="sw"><input type="checkbox" id="spin" checked><i></i>自动旋转</label>
          <span class="spacer"></span><button class="ghost" id="clear">清空</button>
        </div>
      </div>
    </aside>
    <section class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="hud tl"><span class="key"><b style="background:#ff3b4e;border-radius:50%"></b>推向敌意</span><span class="key"><b style="background:#3d8bff;border-radius:50%"></b>拉回</span><span class="key" title="近似：当前位置的 V 路径读取（源头本步写入 → 目标 KV 组的 W_V），不含注意力权重与 MLP 路径；安全模式再乘源头的敌意推力"><b style="background:linear-gradient(90deg,#ffb020,#ff3b4e);height:2px"></b>头→头 读取（本次激活）<span id="flowcov" style="margin-left:6px;color:#5f6676"></span></span><label class="key" style="pointer-events:auto;cursor:pointer" title="仅由权重计算、已减随机基线；是潜在连接，不代表本次实际走过的路径"><input type="checkbox" id="wire" style="margin:0 4px 0 0">潜在布线（权重）</label>
        <span class="key"><b style="border:1px solid #e8ebf2;border-radius:50%;background:none"></b>E01 愤怒头</span><span class="key" id="actkey" style="display:none"><b style="background:#111"></b>激活强度（‖W<sub>O</sub>x‖）</span></div>
            <div class="hm-note" id="hmnote" style="display:none"></div>
      <canvas id="hm2" style="position:absolute;left:0;top:0;width:100%;height:100%;display:none;cursor:crosshair"></canvas>
      <div class="toast" id="toast"></div>
      <div class="empty" id="empty"><h3><em>看见模型在想什么</em></h3><p>每个环是一层 · 环上的点是注意力头（同层排列顺序无含义）· 亮线 = 本次计算中后层实际读取前层的通路 · 光柱颜色 = 情绪</p></div>
      <div class="hc avatar" id="avcard"><canvas id="av"></canvas>
        <div class="cap"><span class="pill" id="avstate">待机</span>
          <select id="avsel" style="background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:999px;font-size:11px;padding:2px 7px;color:#d6dae3">
            <option value="mianmian.vrm">棉棉</option><option value="joy.vrm">Joy</option><option value="utsuwa.vrm">器</option><option value="rose.vrm">Rose</option><option value="polybot.vrm">Polybot</option></select></div>
        <div class="emo"><div class="meter">愉悦 <span class="num" id="e_happy">0.00</span><div class="bar"><i id="m_happy"></i></div></div>
          <div class="meter">悲伤 <span class="num" id="e_sad">0.00</span><div class="bar"><i id="m_sad"></i></div></div>
          <div class="meter">愤怒 <span class="num" id="e_angry">0.00</span><div class="bar"><i id="m_angry"></i></div></div></div>
      </div>
      <div class="hud tok2"><div style="font-size:11px;color:#7c8494">当前生成的字</div><div class="tok" id="tok">—</div><div class="focus" id="focus"></div></div>
      <div class="hudbar">
        <div class="hc prof"><div class="row"><span class="label" id="proflab">层剖面</span></div><canvas id="prof" width="440" height="120"></canvas><div class="foot"><span>L0</span><span>输出</span></div></div>
      <div class="hc risk" id="rc_c2"><div class="row"><span class="label">用户痛苦 · 需转人工<span class="info" data-t="C2：读用户消息在模型内部的表征（第 16 层），不依赖关键词。V1.1 迁移测试 AUROC 0.876。竖线为验证集误报率 5% 处的阈值。">i</span></span><span class="pill" id="st_c2">—</span></div>
        <div class="val" id="v_c2">—</div><div class="track"><i id="f_c2"></i><b id="t_c2"></b></div><div class="foot"><span id="pc_c2">回复前</span><span id="th_c2"></span></div></div>
      <div class="hc risk" id="rc_pre"><div class="row"><span class="label">敌意预测 · 回复前<span class="info" data-t="C1-pre：在第一个字生成前，读第 22 层最后一个提示位置的状态，预测回复是否会带敌意。V1.1 测试集 AUROC 0.919。">i</span></span><span class="pill" id="st_pre">—</span></div>
        <div class="val" id="v_pre">—</div><div class="track"><i id="f_pre"></i><b id="t_pre"></b></div><div class="foot"><span id="pc_pre">首字前</span><span id="th_pre"></span></div></div>
      <div class="hc risk" id="rc_c1"><div class="row"><span class="label">敌意 · 逐字<span class="info" data-t="C1-token：每生成一个字读第 16 层残差流，显示累计均值；8 字后超过阈值即报警。V1.1 测试集 AUROC 0.929。">i</span></span><span class="pill" id="st_c1">—</span></div>
        <div class="val" id="v_c1">—</div><div class="track"><i id="f_c1"></i><b id="t_c1"></b></div><canvas class="spark" id="spark" width="600" height="68"></canvas><div class="foot"><span id="pc_c1">—</span><span id="n_tok">0 个字</span></div></div>
      <div class="hc risk" id="rc_h3" style="display:none"><div class="row"><span class="label">幻觉风险 · 事实问答<span class="info" data-t="C3-H：回复前读第 22 层（测试集 AUROC 0.722，预注册判定：不确定）；生成中读第 19 层答案表征的累计均值（测试集 AUROC 0.811）。训练于 Chinese SimpleQA 短答题，其他场景仅供参考。">i</span></span><span class="pill" id="st_h3">—</span></div>
        <div class="val" id="v_h3">—</div><div class="track"><i id="f_h3"></i><b id="t_h3"></b></div><div class="foot"><span id="pc_h3">—</span><span id="ph_h3">回复前</span></div></div>
      </div>
    </section>
  </div>
</div>
<div class="tip" id="tip"></div>
<script type="importmap">
{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/",
 "@pixiv/three-vrm":"/vendor/three-vrm/three-vrm.module.js"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

        H2.push({t: delta, I: X.inner, s: X.C1_token, conf: X.alarm.C1}); if (DIM === "2d") draw2d();
        if (X.C3H_mean !== undefined && n >= 8){ if (R.h3 !== TH.C3H_mean){ R.h3 = TH.C3H_mean; $("ph_h3").textContent = "生成中 · 答案表征"; $("t_h3").style.left = Math.min(99, R.h3 * 100) + "%"; if ($("th_h3")) $("th_h3").textContent = "阈值 " + R.h3.toFixed(3); } if (X.alarm.C3H) window._h3conf = true; risk("h3", X.C3H_mean, window._h3conf ? 2 : 1);
          if (X.alarm.C3H && qaMode && !window._h3){ window._h3 = true; toast("二档确认 · 这段回答可能包含编造内容，建议核实"); } } if (X.inner) applyInner(X.inner); if (X.emo) expr(X.emo.expr); talk = 1;
        const a = Math.min(.9, X.C1_token); liveEl.insertAdjacentHTML("beforeend", `<span style="background:rgba(255,77,94,${(a * .18).toFixed(3)});box-shadow:inset 0 -1.5px rgba(255,77,94,${(a * .8).toFixed(2)})">${esc(delta)}</span>`); $("conv").scrollTop = 1e9;
        if (delta.trim()) $("tok").textContent = delta.replace(/\n/g, "⏎"); $("tok").style.color = X.C1_token >= R.c1 ? "#ff5a66" : "#f1f3f7";
        spark.push({t: X.C1_token, m: X.C1_mean}); drawSpark(); $("n_tok").textContent = n + " 个字"; if (n % 3 === 0) pulse(X.C1_token >= R.c1 ? 0xff4d5e : 0x8b95ff);
        $("avstate").className = "pill"; $("avstate").textContent = "逐字驱动";
        if (X.alarm.C1 && !alerted){ alerted = true; alarm = 2; $("avcard").classList.add("alert"); const L = lastI ? lastI.layers.indexOf(Math.max(...lastI.layers)) : null;
          toast(`二档确认 · 敌意：第 <span class="num">${X.i - INFO.sustain + 1}–${X.i}</span> 个字连续超阈值${L !== null ? ` · 峰值层 L${L}` : ""}${$("stop").checked ? " · 已拦截" : ""}`); $("avstate").className = "pill alert"; $("avstate").textContent = "二档 · 确认"; } }
      else if (X.phase === "done"){ $("status").textContent = `${X.tokens} 字 · 首读 ${preT} 毫秒 · 每秒 ${Math.round(X.tokens / Math.max(.001, (X.t - preT) / 1000))} 字`;
        if (X.finish === "content_filter"){ liveEl.insertAdjacentHTML("beforeend", '<br><span class="cut">已拦截 · 回复出现敌意倾向</span>'); expr({happy:0, sad:0, angry:0, neutral:1}); talk = 0; } }
    } }
  conv.push({role:"assistant", content: reply || "（无）"}); $("go").disabled = false; $("livedot").style.background = alarm === 2 ? "var(--bad)" : "var(--ok)";
  setTimeout(() => $("avcard").classList.remove("alert"), 2500); liveEl.id = "";
}

// ================= replay / embed mode (user study): /monitor?replay=<trial_id>&view=2d|3d =================
const QS = new URLSearchParams(location.search);
if (QS.get("replay")){
  document.querySelector(".top").style.display = "none"; document.querySelector(".left").style.display = "none"; document.querySelector(".hudbar").style.display = "none";
  $("avcard").style.display = "none"; document.querySelector(".hud.tok2").style.display = "none"; $("empty").style.display = "none";
  document.querySelector(".app").style.gridTemplateRows = "1fr"; document.querySelector(".main").style.gridTemplateColumns = "1fr"; $("stage").style.margin = "0"; $("stage").style.borderRadius = "0";
  $("spin").checked = false; camera.position.set(-3, 10, 31); controls.target.set(0, -0.6, 0); controls.update();
  const bar = document.createElement("div"); bar.style.cssText = "position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:10px;align-items:center;font-size:12px;color:#9aa2b1;z-index:5";
  bar.innerHTML = '<button id="rp_play" style="border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#eceef3;border-radius:999px;padding:4px 12px;cursor:pointer">重播</button><input id="rp_seek" type="range" min="0" value="0" style="flex:1;accent-color:#b9c0cc"><span id="rp_lab" style="min-width:120px;text-align:right"></span>';
  $("stage").appendChild(bar);
  const view = QS.get("view") || "3d"; if (view === "2d") document.querySelector('#dimseg button[data-d="2d"]').click();
  const R0 = await (await fetch("/study/replay/" + encodeURIComponent(QS.get("replay")))).json();
  const FR = R0.frames.filter(m => m.ph === "pre" || m.ph === "token").map(m => ({m, I: m.L ? {layers: m.L, heads_all: m.H, heads_norm: m.H, neurons: m.N, neurons_act: m.N, flow: {safety: m.F, activity: m.F}} : null}));
  $("rp_seek").max = FR.length - 1;
  function show(k){ H2.length = 0; FR.slice(0, k + 1).forEach(({m, I}, j) => H2.push(j === 0 ? {t: "∅", I, s: m.C1_pre, pre: true} : {t: m.d, I, s: m.C1_token, conf: m.al && m.al.C1}));
    const {m, I} = FR[k]; if (I) applyInner(I); alarm = FR.slice(0, k + 1).some(f => f.m.al && f.m.al.C1) ? 2 : 0; if (DIM === "2d") draw2d();
    $("rp_seek").value = k; $("rp_lab").textContent = k === 0 ? "回复前" : `第 ${k} / ${FR.length - 1} 个字「${(m.d || "").replace(/\n/g, "⏎")}」`; }
  $("rp_seek").oninput = e => show(+e.target.value);
  let timer = null; function play(){ clearInterval(timer); let k = 0; show(0); timer = setInterval(() => { k++; if (k >= FR.length){ clearInterval(timer); return; } show(k); }, 60); }
  $("rp_play").onclick = play; play();
  window.parent && window.parent.postMessage({type: "replay-ready", frames: FR.length}, "*");
}
</script>
