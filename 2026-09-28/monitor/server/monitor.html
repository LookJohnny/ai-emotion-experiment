<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interior Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbf9; --panel:#ffffff; --panel2:#f5f5f3; --line:#ebebe8; --line2:#dcdcd8;
  --ink:#111111; --ink2:#3f3f46; --mute:#71717a; --faint:#a1a1aa;
  --accent:#00aa45; --ok:#00aa45; --warn:#d97706; --bad:#e5484d;
  --r:14px; --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif:"Instrument Serif","Times New Roman",serif; --sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label{font-size:11px;color:var(--mute);letter-spacing:.02em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;letter-spacing:-.01em}.brand em{font-style:italic}
.glyph{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 13px var(--sans);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-size:12px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(0,170,69,.14)}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.seg button{border:0;background:none;padding:4px 13px;border-radius:999px;color:var(--mute);cursor:pointer;font-size:12px;transition:all .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.main{display:grid;grid-template-columns:360px 1fr 344px;min-height:0}
@media (max-width:1180px){.main{grid-template-columns:320px 1fr 300px}}

/* ---------- left: conversation ---------- */
.left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--panel)}
.lhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
select.scen{width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.conv{flex:1;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.6;font-size:13px}
.msg.user{align-self:flex-end;background:#111;color:#fff;border-radius:14px 14px 4px 14px}
.msg.assistant{align-self:flex-start;color:var(--ink2);background:var(--panel2);border-radius:14px 14px 14px 4px}
.msg.system{align-self:stretch;color:var(--faint);font-size:11.5px;padding:0 2px}
.msg.live{color:var(--ink);background:#fff;border:1px solid var(--line)}
.msg .who{display:block;font-size:10.5px;color:var(--faint);margin-bottom:2px}
.msg.live span{transition:box-shadow .2s}
.cut{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--bad)}
.composer{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);border-radius:14px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.04);padding:8px 8px 8px 12px;transition:border-color .15s}
.box:focus-within{border-color:var(--line2)}
.box textarea{flex:1;border:0;background:none;resize:none;outline:none;min-height:22px;max-height:120px;line-height:1.5}
.send{width:32px;height:32px;border-radius:10px;border:0;background:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:opacity .15s}
.send:disabled{opacity:.3;cursor:default}
.opts{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:12px}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.sw i{width:28px;height:16px;border-radius:9px;background:#d4d4d8;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;box-shadow:0 1px 2px rgba(0,0,0,.2);border-radius:50%;background:#fff;transition:transform .15s}
.sw input{display:none}.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{transform:translateX(12px)}
.ghost{border:0;background:none;color:var(--mute);cursor:pointer;padding:0}
.ghost:hover{color:var(--ink)}

/* ---------- center: 3D ---------- */
.stage{position:relative;min-width:0;margin:12px;border-radius:18px;overflow:hidden;background:#f4f4f1;border:1px solid var(--line)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;font-size:11px;color:var(--mute)}
.hud.tl{left:16px;top:14px;display:flex;gap:14px}
.hud.bl{left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.key{display:inline-flex;align-items:center;gap:6px}
.key b{width:8px;height:8px;border-radius:2px;display:inline-block}
.tok{font-family:var(--serif);font-size:30px;color:var(--ink);letter-spacing:.02em;min-height:30px;transition:color .2s}
.focus{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right;line-height:1.7}
.toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-8px);opacity:0;transition:all .25s;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:rgba(20,10,12,.85);border:1px solid rgba(255,77,94,.35);color:#ffd6da;font-size:12px;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:rgba(24,18,8,.85);border-color:rgba(245,165,36,.35);color:#ffe7bf}
.tip{position:fixed;pointer-events:none;font-size:11px;background:rgba(17,19,23,.95);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;display:none;font-family:var(--mono);color:var(--ink2);max-width:320px}

/* ---------- right: avatar + risk ---------- */
.right{overflow:auto;padding:12px 14px 14px 2px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .25s,box-shadow .25s}
.card.alert{border-color:rgba(229,72,77,.5);box-shadow:0 0 0 4px rgba(229,72,77,.08)}
.card.watch{border-color:rgba(217,119,6,.35)}
.avatar{position:relative;flex:0 0 auto;height:320px;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#ffffff,#f1f1ee)}
.avatar canvas{position:absolute;inset:0;width:100%;height:100%}
.avatar .cap{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.avatar .emo{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meter{background:rgba(255,255,255,.78);border:1px solid var(--line);backdrop-filter:blur(6px);border-radius:7px;padding:4px 7px;font-size:10.5px;color:var(--mute)}
.meter .bar{height:2px;background:#ececea;border-radius:2px;margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--ink2);transition:width .2s}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:500;color:var(--mute);background:#f1f1ef}
.pill.ok{color:#007a32;background:#e6f6ec}.pill.watch{color:#a15c00;background:#fdf1dc}.pill.alert{color:#c4262c;background:#fde8e8}
.risk{padding:12px 14px}
.risk .row{display:flex;justify-content:space-between;align-items:center}
.risk .val{font-family:var(--serif);font-size:38px;font-weight:400;line-height:1.05;letter-spacing:-.02em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.track{position:relative;height:4px;border-radius:3px;background:#efefec}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2);transition:width .25s,background .25s}
.track b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink);opacity:.55}
.spark{width:100%;height:34px;display:block;margin-top:10px}
.foot{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--faint)}
.info{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--mute);font-size:9.5px;cursor:help;margin-left:6px}
.info:hover::after{content:attr(data-t);position:absolute;right:-6px;top:20px;width:250px;padding:10px 12px;border-radius:10px;background:#111;border:0;color:#f4f4f5;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:11px;line-height:1.55;z-index:5;white-space:normal}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="glyph">I</span><span><em>Interior</em> Monitor</span></div>
    <span class="chip" id="modelchip">—</span>
    <span class="spacer"></span>
    <div class="seg" id="viewseg"><button data-v="safety" class="on">安全投影</button><button data-v="activity">激活强度</button></div>
    <span class="chip"><span class="dot" id="livedot"></span><span id="status" class="num">就绪</span></span>
  </header>
  <div class="main">
    <aside class="left">
      <div class="lhead"><span class="label">场景</span><select class="scen" id="scen"></select></div>
      <div class="conv" id="conv"></div>
      <div class="composer">
        <div class="box"><textarea id="msg" rows="1" placeholder="输入消息，⌘/Ctrl + Enter 发送"></textarea>
          <button class="send" id="go" title="发送"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
        <div class="opts">
          <label class="sw"><input type="checkbox" id="stop"><i></i>报警即拦截</label>
          <label class="sw"><input type="checkbox" id="spin"><i></i>自动旋转</label>
          <span class="spacer"></span><button class="ghost" id="clear">清空</button>
        </div>
      </div>
    </aside>
    <section class="stage" id="stage">
      <canvas id="gl"></canvas>
      <div class="hud tl"><span class="key"><b style="background:var(--bad)"></b>推向敌意</span><span class="key"><b style="background:#5b8cff"></b>拉回</span>
        <span class="key"><b style="background:#111;height:2px"></b>E01 愤怒头</span><span class="key">柱高 = 头对敌意方向的真实推力</span><span class="key" id="actkey" style="display:none"><b style="background:#111"></b>激活强度（‖W<sub>O</sub>x‖）</span></div>
      <div class="toast" id="toast"></div>
      <div class="hud bl"><div><div style="font-size:11px;color:var(--mute)">当前 token</div><div class="tok" id="tok">—</div></div><div class="focus" id="focus"></div></div>
    </section>
    <aside class="right">
      <div class="card avatar" id="avcard"><canvas id="av"></canvas>
        <div class="cap"><span class="pill" id="avstate">待机</span>
          <select id="avsel" style="background:#fff;border:1px solid var(--line2);border-radius:999px;font-size:11px;padding:3px 8px;color:var(--ink2)">
            <option value="mianmian.vrm">棉棉</option><option value="joy.vrm">Joy</option><option value="utsuwa.vrm">器</option><option value="rose.vrm">Rose</option><option value="polybot.vrm">Polybot</option></select></div>
        <div class="emo"><div class="meter">愉悦 <span class="num" id="e_happy">0.00</span><div class="bar"><i id="m_happy"></i></div></div>
          <div class="meter">悲伤 <span class="num" id="e_sad">0.00</span><div class="bar"><i id="m_sad"></i></div></div>
          <div class="meter">愤怒 <span class="num" id="e_angry">0.00</span><div class="bar"><i id="m_angry"></i></div></div></div>
      </div>
      <div class="card risk" id="rc_c2"><div class="row"><span class="label">用户痛苦 · 需转人工<span class="info" data-t="C2：读用户消息在模型内部的表征（第 16 层），不依赖关键词。V1.1 迁移测试 AUROC 0.876。竖线为验证集误报率 5% 处的阈值。">i</span></span><span class="pill" id="st_c2">—</span></div>
        <div class="val" id="v_c2">—</div><div class="track"><i id="f_c2"></i><b id="t_c2"></b></div><div class="foot"><span>回复前</span><span id="th_c2"></span></div></div>
      <div class="card risk" id="rc_pre"><div class="row"><span class="label">敌意预测 · 回复前<span class="info" data-t="C1-pre：在第一个字生成前，读第 22 层最后一个提示位置的状态，预测回复是否会带敌意。V1.1 测试集 AUROC 0.919。">i</span></span><span class="pill" id="st_pre">—</span></div>
        <div class="val" id="v_pre">—</div><div class="track"><i id="f_pre"></i><b id="t_pre"></b></div><div class="foot"><span>首字前</span><span id="th_pre"></span></div></div>
      <div class="card risk" id="rc_c1"><div class="row"><span class="label">敌意 · 逐字<span class="info" data-t="C1-token：每生成一个字读第 16 层残差流，显示累计均值；8 字后超过阈值即报警。V1.1 测试集 AUROC 0.929。">i</span></span><span class="pill" id="st_c1">—</span></div>
        <div class="val" id="v_c1">—</div><div class="track"><i id="f_c1"></i><b id="t_c1"></b></div><canvas class="spark" id="spark" width="600" height="68"></canvas><div class="foot"><span id="n_tok">0 tokens</span><span id="th_c1"></span></div></div>
      <div class="label" style="padding:2px 4px 0;line-height:1.6;color:var(--faint)">颜色来自真实前向计算。逐层探针仅用于可视化（非预注册）。单个神经元不是情绪载体（E01）。</div>
    </aside>
  </div>
</div>
<div class="tip" id="tip"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
 "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id), esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const INFO = await (await fetch("/info")).json(), TH = INFO.thresholds;
const CFG = INFO.inner ? INFO.inner.config : {n_layers:36, n_heads:32, n_kv_heads:8, intermediate:9728, hidden:2560, model_type:"qwen3", params_b:4.02};
const NL = CFG.n_layers, NH = CFG.n_heads, NKV = CFG.n_kv_heads || NH, NN = CFG.intermediate, DY = 20 / NL, Y = L => 0.4 + L * DY;
const SLOTS = Math.min(NN, Math.floor(420000 / NL)), slotOf = n => Math.floor(n * SLOTS / NN);
const B3 = new Set(INFO.inner ? INFO.inner.heads : []);
const MNAME = /^(master|main|snapshot)$/i.test(INFO.model) ? `${CFG.model_type[0].toUpperCase()}${CFG.model_type.slice(1)}-${Math.round(CFG.params_b)}B` : INFO.model;
$("modelchip").textContent = `${MNAME} · ${CFG.params_b}B params · ${NL}L · ${NH}H/${NKV}KV · ${NN} MLP`;
const headAngle = (L, h) => { const per = NH / NKV, g = Math.floor(h / per), j = h % per; return (g + (j + 0.5) / per * 0.8 + 0.1) / NKV * Math.PI * 2; };

// ================= 3D interior: head-push terrain =================
// x = query heads (grouped by shared KV), z = layers, bar height = real push of that head on the layer's hostility probe.
const canvas = $("gl"), stage = $("stage"), renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f4f1);
const PER = NH / NKV, GAP = 0.9, CW = 0.34, CZ = 0.34;
const colX = h => { const g = Math.floor(h / PER), j = h % PER; return (g * (PER + GAP) + j) * CW; };
const W = colX(NH - 1) + CW, D = NL * CZ, X0 = -W / 2, Z0 = -D / 2;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = 0.07; controls.autoRotateSpeed = 0.35;
controls.enableZoom = true; controls.minZoom = 0.6; controls.maxZoom = 4;
camera.position.set(-W * 0.9, W * 0.95, D * 0.95); controls.target.set(0, 0.4, 0);
function resize(){ const r = stage.getBoundingClientRect(), asp = r.width / r.height, v = Math.max(W, D) * 0.78;
  camera.left = -v * asp; camera.right = v * asp; camera.top = v; camera.bottom = -v; camera.updateProjectionMatrix(); renderer.setSize(r.width, r.height, false); }
new ResizeObserver(resize).observe(stage);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d9d4, 1.05)); const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(-4, 10, 6); scene.add(sun);
const C = { base: new THREE.Color(0xdedfda), hot: new THREE.Color(0xe5484d), cold: new THREE.Color(0x3b82f6), act: new THREE.Color(0x111111), plate: 0xffffff };
// ground plate per KV group + faint layer lines
const plateMat = new THREE.MeshStandardMaterial({color: C.plate, roughness: 1});
for (let g = 0; g < NKV; g++){ const x0 = X0 + colX(g * PER) - CW * 0.35, w = PER * CW + CW * 0.7 - CW * 0.3;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, D + CZ * 0.4), plateMat); m.position.set(x0 + w / 2 - CW * 0.15, -0.02, 0); scene.add(m); }
const lines = new THREE.LineBasicMaterial({color: 0xe7e7e3});
for (let L = 0; L <= NL; L += Math.max(1, Math.round(NL / 12))){ const z = Z0 + L * CZ; const gm = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(X0 - 1.4, 0.001, z), new THREE.Vector3(X0 + W + 1.4, 0.001, z)]); scene.add(new THREE.Line(gm, lines)); }
// head bars
const heads = new THREE.InstancedMesh(new THREE.BoxGeometry(CW * 0.72, 1, CZ * 0.72), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.55, metalness: 0}), NL * NH);
const headV = new Float32Array(NL * NH), headT = new Float32Array(NL * NH), d = new THREE.Object3D();
function placeHead(i, hgt){ const L = Math.floor(i / NH), h = i % NH; d.position.set(X0 + colX(h), hgt / 2, Z0 + L * CZ + CZ / 2); d.scale.set(1, hgt, 1); d.updateMatrix(); heads.setMatrixAt(i, d.matrix); }
for (let i = 0; i < NL * NH; i++){ placeHead(i, 0.04); heads.setColorAt(i, C.base); }
scene.add(heads);

const tick = new THREE.MeshBasicMaterial({color: 0x111111});
for (let L = 0; L < NL; L++) for (let h = 0; h < NH; h++) if (B3.has(`L${L}H${h}`)){ const m = new THREE.Mesh(new THREE.BoxGeometry(CW * 0.72, 0.01, 0.035), tick); m.position.set(X0 + colX(h), 0.005, Z0 + L * CZ + CZ * 0.08); scene.add(m); }
// layer readout ribbon (left) and neuron heat strip (right)
const beam = [], ribMat = [];
for (let L = 0; L < NL; L++){ const mat = new THREE.MeshStandardMaterial({color: C.base.clone(), roughness: 1}); const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, CZ * 0.86), mat);
  m.position.set(X0 - 0.95, 0.03, Z0 + L * CZ + CZ / 2); scene.add(m); beam.push({m: mat, mesh: m, v: 0, tv: 0}); }
const NBIN = 24, nbar = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 1, CZ * 0.6), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: .6}), NL * NBIN);
const nV = new Float32Array(NL * NBIN), nT = new Float32Array(NL * NBIN);
function placeN(i, hgt){ const L = Math.floor(i / NBIN), b = i % NBIN; d.position.set(X0 + W + 0.5 + b * 0.065, hgt / 2, Z0 + L * CZ + CZ / 2); d.scale.set(1, hgt, 1); d.updateMatrix(); nbar.setMatrixAt(i, d.matrix); }
for (let i = 0; i < NL * NBIN; i++){ placeN(i, 0.02); nbar.setColorAt(i, C.base); } scene.add(nbar);
function label(txt, x, z, size = 0.5, col = "#6b6b67"){ const c = document.createElement("canvas"); c.width = 256; c.height = 64; const g = c.getContext("2d");
  g.fillStyle = col; g.font = "500 40px Inter,-apple-system,\"PingFang SC\",sans-serif"; g.textAlign = "center"; g.fillText(txt, 128, 46);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false})); sp.scale.set(size * 4, size, 1); sp.position.set(x, 0.05, z); scene.add(sp); }
for (let L = 0; L < NL; L += Math.max(1, Math.round(NL / 6))) label("L" + L, X0 - 2.0, Z0 + L * CZ + CZ / 2);
label("L" + (NL - 1), X0 - 2.0, Z0 + (NL - 1) * CZ + CZ / 2);
for (let g = 0; g < NKV; g++) label("KV" + g, X0 + colX(g * PER) + (PER - 1) * CW / 2, Z0 - 0.6, 0.42);
label("层读数", X0 - 0.95, Z0 - 0.6, 0.42); label("神经元", X0 + W + 0.5 + NBIN * 0.065 / 2, Z0 - 0.6, 0.42);

let MODE = "safety", lastI = null, alarm = 0;
function pulse(){}
function applyInner(I){
  lastI = I; const act = MODE === "activity";
  if (act){ const mx = Math.max(...I.resid_norm); I.resid_norm.forEach((v, L) => beam[L].tv = v / mx); } else I.layers.forEach((v, L) => beam[L].tv = v);
  const M = act ? I.heads_norm : I.heads_all; let mx = 1e-6; M.forEach(r => r.forEach(v => mx = Math.max(mx, Math.abs(v))));
  let best = {v:-1e9, n:""}; M.forEach((row, L) => row.forEach((v, h) => { headT[L * NH + h] = v / mx; if (v > best.v) best = {v, n:`L${L}·H${h}`}; }));
  const N = act ? I.neurons_act : I.neurons; let nm = 1e-6; N.forEach(l => l.forEach(([, v]) => nm = Math.max(nm, Math.abs(v)))); nT.fill(0);
  let bn = {v:-1, n:""}; N.forEach((lst, L) => lst.forEach(([n, v]) => { const i = L * NBIN + Math.floor(n * NBIN / NN); if (Math.abs(v) > Math.abs(nT[i] * nm)) nT[i] = v / nm; if (Math.abs(v) > bn.v) bn = {v:Math.abs(v), n:`L${L}·N${n}`}; }));
  const src = act ? I.resid_norm : I.layers, Lm = src.indexOf(Math.max(...src));
  $("focus").innerHTML = act ? `peak residual  L${Lm}  ${I.resid_norm[Lm]}<br>top head  ${best.n}  ‖W<sub>O</sub>x‖ ${best.v.toFixed(1)}<br>top neuron  ${bn.n}`
    : `hottest layer  L${Lm}  ${I.layers[Lm].toFixed(2)}<br>top head  ${best.n}${B3.has(best.n.replace("·", "")) ? "  (E01)" : ""}<br>top neuron  ${bn.n}`;
}
const tc = new THREE.Color();
function step(dt){
  const k = 1 - Math.exp(-dt / 0.16), act = MODE === "activity";
  beam.forEach(b => { b.v += (b.tv - b.v) * k; const t = Math.min(1, Math.max(0, b.v)); tc.copy(C.base).lerp(act ? C.act : C.hot, act ? t : Math.max(0, (t - .1) / .9)); b.m.color.copy(tc); b.mesh.scale.y = 1 + 5 * t; b.mesh.position.y = 0.03 * (1 + 5 * t); });
  for (let i = 0; i < headV.length; i++){ headV[i] += (headT[i] - headV[i]) * k; const a = Math.max(-1, Math.min(1, headV[i]));
    placeHead(i, 0.04 + 2.2 * Math.abs(a) ** 0.9);
    if (act) tc.copy(C.base).lerp(C.act, Math.abs(a) ** 0.7); else if (a > 0) tc.copy(C.base).lerp(C.hot, Math.min(1, a * 1.4) ** 0.8); else tc.copy(C.base).lerp(C.cold, Math.min(1, -a * 1.4) ** 0.8);
    heads.setColorAt(i, tc); }
  heads.instanceMatrix.needsUpdate = true; heads.instanceColor.needsUpdate = true;
  for (let i = 0; i < nV.length; i++){ nV[i] += (nT[i] - nV[i]) * k; const a = Math.max(-1, Math.min(1, nV[i])); placeN(i, 0.02 + 1.2 * Math.abs(a));
    tc.copy(C.base).lerp(act ? C.act : (a >= 0 ? C.hot : C.cold), Math.min(1, Math.abs(a) * 1.3)); nbar.setColorAt(i, tc); }
  nbar.instanceMatrix.needsUpdate = true; nbar.instanceColor.needsUpdate = true;
}

// ================= avatar =================
const avC = $("av"), avR = new THREE.WebGLRenderer({canvas: avC, antialias:true, alpha:true}); avR.setPixelRatio(Math.min(devicePixelRatio, 2));
const avS = new THREE.Scene(), avCam = new THREE.PerspectiveCamera(22, 1, 0.1, 20);
avS.add(new THREE.AmbientLight(0xffffff, 0.75)); const kl = new THREE.DirectionalLight(0xffffff, 1.15); kl.position.set(1, 2, 2); avS.add(kl);
const fl = new THREE.DirectionalLight(0x9aa6ff, 0.35); fl.position.set(-2, 1, 1); avS.add(fl);
function avResize(){ const r = avC.parentElement.getBoundingClientRect(); avR.setSize(r.width, r.height, false); avCam.aspect = r.width / r.height; avCam.updateProjectionMatrix(); }
new ResizeObserver(avResize).observe($("avcard"));
let vrm = null; const vl = new GLTFLoader().register(p => new VRMLoaderPlugin(p));
function loadAvatar(f){ vl.load("/vrm/" + f, g => { if (vrm){ avS.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
  vrm = g.userData.vrm; VRMUtils.rotateVRM0(vrm); avS.add(vrm.scene); const s = vrm.meta?.metaVersion === "0" ? -1 : 1, h = vrm.humanoid;
  h.getNormalizedBoneNode("leftUpperArm")?.rotation.set(0, 0, s * -1.2); h.getNormalizedBoneNode("rightUpperArm")?.rotation.set(0, 0, s * 1.2);
  vrm.update(0); const hd = h.getRawBoneNode("head") || h.getNormalizedBoneNode("head"), p = new THREE.Vector3(); hd ? hd.getWorldPosition(p) : p.set(0, 1.35, 0);
  avCam.position.set(0, p.y + 0.03, p.z + 1.2); avCam.lookAt(0, p.y - 0.04, p.z); }, undefined, e => console.error(e)); }
let saved = null; try { saved = localStorage.getItem("imAvatar"); } catch (_) {}
if (saved) $("avsel").value = saved; $("avsel").onchange = e => { try { localStorage.setItem("imAvatar", e.target.value); } catch (_) {} loadAvatar(e.target.value); }; loadAvatar($("avsel").value);
const eT = {happy:0, sad:0, angry:0, neutral:1}, eC = {...eT}; let talk = 0, blink = 3, at = 0;
function expr(e){ Object.assign(eT, e); ["happy","sad","angry"].forEach(k => { $("e_"+k).textContent = (e[k] ?? 0).toFixed(2); $("m_"+k).style.width = Math.min(100, (e[k] ?? 0) * 100) + "%"; }); }
function avStep(dt){ at += dt; for (const k in eC) eC[k] += (eT[k] - eC[k]) * (1 - Math.exp(-dt / 0.15));
  if (vrm){ const em = vrm.expressionManager; ["happy","sad","angry"].forEach(k => em.setValue(k, eC[k] * .9)); em.setValue("relaxed", Math.max(0, eC.neutral - .6) * .3);
    blink -= dt; const b = blink < .12 ? Math.sin(Math.PI * Math.max(0, blink) / .12) : 0; if (blink < 0) blink = 2.5 + Math.random() * 3.5; em.setValue("blink", Math.max(b, eC.angry * .15));
    talk = Math.max(0, talk - dt * 2.5); em.setValue("aa", talk > 0 ? .22 + .32 * Math.abs(Math.sin(at * 17)) * talk : 0);
    const hd = vrm.humanoid.getNormalizedBoneNode("head"); if (hd){ hd.rotation.x = .025 * Math.sin(at * .8) + eC.sad * .12 - eC.angry * .04; hd.rotation.y = .035 * Math.sin(at * .5); }
    vrm.update(dt); }
  avR.render(avS, avCam); }

const clock = new THREE.Clock();
(function loop(){ const dt = Math.min(clock.getDelta(), .1); controls.autoRotate = $("spin").checked; controls.update(); step(dt); avStep(dt); renderer.render(scene, camera); requestAnimationFrame(loop); })();

// hover
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
canvas.addEventListener("pointermove", e => { const r = canvas.getBoundingClientRect(); mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(heads)[0], t = $("tip");
  if (!hit){ t.style.display = "none"; return; }
  const i = hit.instanceId, L = Math.floor(i / NH), h = i % NH; t.style.display = "block"; t.style.left = e.clientX + 14 + "px"; t.style.top = e.clientY + 14 + "px";
  t.innerHTML = `L${L}·H${h}  ·  KV group ${Math.floor(h / (NH / NKV))}${B3.has(`L${L}H${h}`) ? "  ·  E01 anger head" : ""}` + (lastI ? `<br>‖W<sub>O</sub>x‖ ${lastI.heads_norm[L][h]}   push ${lastI.heads_all[L][h]}<br>layer hostility ${lastI.layers[L]}   residual ${lastI.resid_norm[L]}` : ""); });

// ================= risk cards =================
const R = {c2: TH.C2, pre: TH.C1_pre, c1: TH.C1_mean};
["c2","pre","c1"].forEach(k => { $("t_"+k).style.left = Math.min(99, R[k] * 100) + "%"; $("th_"+k).textContent = "阈值 " + R[k].toFixed(3); });
function risk(k, v){
  const st = v >= R[k] ? "alert" : v >= R[k] * .6 ? "watch" : "ok";
  $("v_"+k).textContent = v.toFixed(3); $("f_"+k).style.width = Math.min(100, v * 100) + "%";
  $("f_"+k).style.background = st === "alert" ? "var(--bad)" : st === "watch" ? "var(--warn)" : "var(--ink)";
  $("st_"+k).className = "pill " + st; $("st_"+k).textContent = {ok:"正常", watch:"关注", alert:"报警"}[st];
  $("rc_"+k).className = "card risk " + (st === "alert" ? "alert" : st === "watch" ? "watch" : "");
}
function resetRisk(){ ["c2","pre","c1"].forEach(k => { $("v_"+k).textContent = "—"; $("f_"+k).style.width = "0"; $("st_"+k).className = "pill"; $("st_"+k).textContent = "—"; $("rc_"+k).className = "card risk"; }); }
let spark = [];
function drawSpark(){ const c = $("spark"), g = c.getContext("2d"), W = c.width, H = c.height; g.clearRect(0, 0, W, H); if (spark.length < 2) return;
  const X = i => i / Math.max(40, spark.length - 1) * W, Yv = v => H - 4 - Math.min(1, v) * (H - 8);
  g.strokeStyle = "rgba(0,0,0,.18)"; g.setLineDash([3, 4]); g.beginPath(); g.moveTo(0, Yv(R.c1)); g.lineTo(W, Yv(R.c1)); g.stroke(); g.setLineDash([]);
  g.strokeStyle = "rgba(0,0,0,.12)"; g.lineWidth = 1.5; g.beginPath(); spark.forEach((s, i) => i ? g.lineTo(X(i), Yv(s.t)) : g.moveTo(X(i), Yv(s.t))); g.stroke();
  const last = spark[spark.length - 1].m; g.strokeStyle = last >= R.c1 ? "#e5484d" : "#111"; g.lineWidth = 2.5; g.beginPath(); spark.forEach((s, i) => i ? g.lineTo(X(i), Yv(s.m)) : g.moveTo(X(i), Yv(s.m))); g.stroke(); }
let toastT = null;
function toast(html, kind){ const t = $("toast"); t.innerHTML = html; t.className = "toast show " + (kind || ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast " + (kind || ""), 4200); }

// ================= conversation =================
let conv = [], presets = [];
function renderConv(extra){ $("conv").innerHTML = conv.map(m => `<div class="msg ${m.role}">${m.role === "system" ? "系统 · " : ""}${esc(m.content)}</div>`).join("") + (extra || ""); $("conv").scrollTop = 1e9; }
presets = await (await fetch("/presets")).json();
$("scen").innerHTML = '<option value="">选择场景…</option>' + presets.map((p, i) => `<option value="${i}">${esc(p.group.split("（")[0])} · ${esc(p.label)}</option>`).join("");
$("scen").onchange = e => { if (e.target.value === "") return; conv = JSON.parse(JSON.stringify(presets[+e.target.value].messages)); renderConv(); resetRisk(); };
document.querySelectorAll("#viewseg button").forEach(b => b.onclick = () => { document.querySelectorAll("#viewseg button").forEach(x => x.classList.toggle("on", x === b)); MODE = b.dataset.v;
  $("actkey").style.display = MODE === "activity" ? "" : "none"; if (lastI) applyInner(lastI); });
$("msg").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; });
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(); });
$("go").onclick = send; $("clear").onclick = () => { conv = []; renderConv(); resetRisk(); $("scen").value = ""; };

async function send(){
  const text = $("msg").value.trim(); if (text) conv.push({role:"user", content:text});
  if (!conv.length || conv[conv.length - 1].role !== "user") return;
  $("msg").value = ""; $("msg").style.height = "auto"; $("go").disabled = true; resetRisk(); spark = []; drawSpark(); alarm = 0;
  renderConv('<div class="msg assistant live" id="live"></div>'); const liveEl = $("live");
  $("status").textContent = "生成中"; $("livedot").style.background = "var(--accent)"; $("avstate").className = "pill"; $("avstate").textContent = "读取中";
  const res = await fetch("/v1/chat/completions", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({messages: conv, stream: true, max_tokens: 200, temperature: 0.7, x_action: $("stop").checked ? "stop" : "log"})});
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "", reply = "", n = 0, preT = null, alerted = false;
  while (true){ const {value, done} = await rd.read(); if (done) break; buf += dec.decode(value, {stream:true}); let i;
    while ((i = buf.indexOf("\n\n")) >= 0){ const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
      if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
      const dd = JSON.parse(line.slice(6)), X = dd.x_risk, delta = dd.choices[0].delta.content || "";
      if (X.phase === "pre"){ preT = X.t; risk("c2", X.C2); risk("pre", X.C1_pre); if (X.inner) applyInner(X.inner); if (X.emo) expr(X.emo.expr);
        $("avstate").className = "pill watch"; $("avstate").textContent = "预同步 · 尚无文字"; pulse(X.C1_pre >= R.pre ? 0xff4d5e : 0x8b95ff); $("tok").textContent = "∅";
        if (X.alarm.C2) toast("用户情绪强烈 · 建议转人工");
        if (X.alarm.C1_pre){ alarm = 1; toast(`回复前预警：可能出现敌意 <span class="num">${X.C1_pre.toFixed(2)}</span>`, "warn"); } }
      else if (X.phase === "token"){ n++; reply += delta; risk("c1", X.C1_mean); if (X.inner) applyInner(X.inner); if (X.emo) expr(X.emo.expr); talk = 1;
        const a = Math.min(.9, X.C1_token); liveEl.insertAdjacentHTML("beforeend", `<span style="background:rgba(229,72,77,${(a * .22).toFixed(3)});box-shadow:inset 0 -1.5px rgba(229,72,77,${(a * .9).toFixed(2)})">${esc(delta)}</span>`); $("conv").scrollTop = 1e9;
        if (delta.trim()) $("tok").textContent = delta.replace(/\n/g, "⏎"); $("tok").style.color = X.C1_token >= R.c1 ? "var(--bad)" : "var(--ink)";
        spark.push({t: X.C1_token, m: X.C1_mean}); drawSpark(); $("n_tok").textContent = n + " tokens"; if (n % 3 === 0) pulse(X.C1_token >= R.c1 ? 0xff4d5e : 0x8b95ff);
        $("avstate").className = "pill"; $("avstate").textContent = "逐字驱动";
        if (X.alarm.C1 && !alerted){ alerted = true; alarm = 2; $("avcard").classList.add("alert"); const L = lastI ? lastI.layers.indexOf(Math.max(...lastI.layers)) : null;
          toast(`敌意报警 · 第 <span class="num">${X.i}</span> 个 token${L !== null ? ` · 峰值层 L${L}` : ""}`); $("avstate").className = "pill alert"; $("avstate").textContent = "敌意报警"; } }
      else if (X.phase === "done"){ $("status").textContent = `${X.tokens} tok · 首读 ${preT} ms · ${Math.round(X.tokens / Math.max(.001, (X.t - preT) / 1000))} tok/s`;
        if (X.finish === "content_filter"){ liveEl.insertAdjacentHTML("beforeend", '<br><span class="cut">已拦截 · 回复出现敌意倾向</span>'); expr({happy:0, sad:0, angry:0, neutral:1}); talk = 0; } }
    } }
  conv.push({role:"assistant", content: reply || "（无）"}); $("go").disabled = false; $("livedot").style.background = alarm === 2 ? "var(--bad)" : "var(--ok)";
  setTimeout(() => $("avcard").classList.remove("alert"), 2500); liveEl.id = "";
}
</script>
</body>
