display_information:
  name: Nous 读心
  description: AI 安全同事。读出群里 AI 回复背后的状态，平时安静，必要时提醒你。
  background_color: "#0a0b0e"
features:
  bot_user:
    display_name: Nous 读心
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - channels:read
      - groups:read
      - im:write
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
