[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nous"
version = "0.1.0"
description = "Read an LLM's internal state before and while it speaks: expression pre-sync, safety alerts, white-box audit."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51,<5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
client = ["httpx>=0.27", "websockets>=12"]
test = ["pytest>=8"]

[project.scripts]
nous = "nous.cli:main"

[tool.setuptools]
packages = ["nous", "nous.engine"]

[tool.setuptools.package-data]
nous = ["web/*.html", "web/*.js", "web/*.json", "web/vendor/**/*", "web/fonts/**/*", "web/vrm/*"]
