<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nous 陪伴引擎</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<script src="/static/auth.js"></script>
<style>
:root{
  --bg:#0a0b0e; --panel:#111319; --panel2:#171a21; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --ink:#eceef3; --ink2:#b9c0cc; --mute:#7f8795; --faint:#4f5663;
  --ok:#22c55e; --warn:#f5a524; --bad:#ff4d5e; --care:#5b8def;
  --happy:#f2c14e; --sad:#5b8def; --angry:#ff4d5e; --neutral:#7f8795;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif:"Instrument Serif","Times New Roman",serif; --sans:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;color:var(--mute);letter-spacing:.02em}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(10,11,14,.85);backdrop-filter:blur(12px);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.glyph{width:24px;height:24px;border-radius:7px;background:var(--ok);color:#fff;display:grid;place-items:center;font:600 13px var(--sans)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-size:12px;background:var(--panel);white-space:nowrap}
.chip.link:hover{border-color:var(--line2);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.spacer{flex:1}
.main{display:grid;grid-template-columns:1fr 400px;min-height:0}

/* stage */
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#1a1d26 0%,#0d0f14 55%,#0a0b0e 100%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;display:flex;gap:8px;align-items:center;pointer-events:none}
.hud.tl{left:20px;top:18px}.hud.tr{right:20px;top:18px}
.state{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:999px;background:rgba(17,19,25,.72);border:1px solid var(--line2);backdrop-filter:blur(8px);font-size:12px;color:var(--ink2);transition:all .2s}
.state i{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .2s}
.state.pre i{background:#b18cff}.state.talk i{background:var(--ok)}.state.block i{background:var(--bad)}.state.care i{background:var(--care)}
.state.block{color:#ffd9dd;border-color:rgba(255,77,94,.45)}
.metric{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:rgba(17,19,25,.72);border:1px solid var(--line);font-size:12px;color:var(--mute)}
.metric b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11.5px}
.caption{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(680px,calc(100% - 40px));text-align:center;pointer-events:none}
.caption p{font-size:18px;line-height:1.6;color:var(--ink);text-shadow:0 2px 18px rgba(0,0,0,.6);transition:opacity .3s}
.caption p.old{font-size:14px;color:var(--mute)}
.caption .blocked{display:inline-block;margin-top:6px;font-size:12px;color:#ffb3bb}

/* panel */
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.sec h3{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.02em;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;outline:none}
select:focus,textarea:focus{border-color:rgba(255,255,255,.28)}
.hint{margin-top:7px;font-size:11.5px;color:var(--mute);line-height:1.5}
.conv{flex:1;min-height:120px;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:7px 11px;border-radius:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#232733;color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.msg.seed{opacity:.45}
.msg .tag{display:block;font-size:11px;margin-top:4px;color:#ffb3bb}
.empty{margin:auto;color:var(--faint);font-size:12px;text-align:center}
.compose{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.compose textarea{height:40px;min-height:40px;max-height:120px;resize:none;line-height:1.45}
.btn{height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;flex:0 0 auto}
.btn:disabled{opacity:.35;cursor:default}
.ghost{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mute);font-size:11.5px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--line2)}
.bars{display:grid;grid-template-columns:40px 1fr 38px;gap:7px 10px;align-items:center;font-size:12px}
.bars span{color:var(--ink2)}
.track{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.fill{height:100%;width:0;border-radius:3px;transition:width .15s}
.bars em{font-style:normal;text-align:right;color:var(--mute);font-family:var(--mono);font-size:11px}
.events{max-height:170px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.ev{display:grid;grid-template-columns:62px 8px 1fr;gap:8px;align-items:baseline;font-size:12px;color:var(--ink2)}
.ev time{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.ev i{width:7px;height:7px;border-radius:50%;background:var(--faint);transform:translateY(-1px)}
.ev.pre i{background:#b18cff}.ev.sent i{background:var(--ok)}.ev.block i{background:var(--bad)}.ev.care i{background:var(--care)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--mute);font-size:11.5px}
.toggle input{accent-color:#eceef3}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .stage{height:58vh}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .conv{max-height:320px}
  .top{padding:0 16px}.top .hide-sm{display:none}
  .caption p{font-size:16px}
}
</style>
<script type="importmap">
{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/","@pixiv/three-vrm":"/vendor/three-vrm/three-vrm.module.js"}}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="glyph">N</span>Nous</div>
    <span class="chip hide-sm">陪伴引擎</span>
    <div class="spacer"></div>
    <a class="chip link hide-sm" href="/console">控制台</a>
    <a class="chip link hide-sm" href="/parent">家长端</a>
    <span class="chip"><span class="dot" id="conn"></span><span id="connt">连接中</span></span>
  </header>
  <div class="main">
    <section class="stage" id="stage">
      <canvas id="av"></canvas>
      <div class="hud tl"><span class="state" id="state"><i></i><span id="statet">待机</span></span></div>
      <div class="hud tr"><span class="metric">首个表情 <b id="m_expr">—</b></span><span class="metric">首句 <b id="m_sent">—</b></span></div>
      <div class="caption" id="cap"></div>
    </section>
    <aside class="panel">
      <div class="sec">
        <h3>场景 <select id="avsel" style="width:auto;height:26px;padding:0 8px;border-radius:999px;font-size:11.5px"></select></h3>
        <select id="scen"></select>
        <p class="hint" id="scenhint">选一个场景，或直接在下面和它聊天。</p>
      </div>
      <div class="conv" id="conv"><p class="empty">还没有对话</p></div>
      <div class="compose">
        <textarea id="msg" placeholder="以孩子的口吻说点什么…" rows="1"></textarea>
        <button class="btn" id="go">发送</button>
      </div>
      <div class="sec" style="border-top:1px solid var(--line)">
        <h3>表情 <label class="toggle"><input type="checkbox" id="tts"> 朗读</label></h3>
        <div class="bars">
          <span>开心</span><div class="track"><div class="fill" id="b_happy" style="background:var(--happy)"></div></div><em id="v_happy">0.00</em>
          <span>难过</span><div class="track"><div class="fill" id="b_sad" style="background:var(--sad)"></div></div><em id="v_sad">0.00</em>
          <span>生气</span><div class="track"><div class="fill" id="b_angry" style="background:var(--angry)"></div></div><em id="v_angry">0.00</em>
          <span>平静</span><div class="track"><div class="fill" id="b_neutral" style="background:var(--neutral)"></div></div><em id="v_neutral">1.00</em>
        </div>
      </div>
      <div class="sec" style="border-bottom:0">
        <h3>事件 <button class="ghost" id="reset">新对话</button></h3>
        <div class="events" id="events"><p class="label">发送消息后，这里按时间列出引擎的每个决定。</p></div>
      </div>
    </aside>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- avatar ----------
const cv = $("av"), R = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: true}); R.setPixelRatio(Math.min(devicePixelRatio, 2));
const S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(20, 1, 0.1, 20);
S.add(new THREE.AmbientLight(0xffffff, 0.8)); const k1 = new THREE.DirectionalLight(0xffffff, 1.1); k1.position.set(1, 2, 2); S.add(k1);
const k2 = new THREE.DirectionalLight(0x9aa6ff, 0.35); k2.position.set(-2, 1, 1); S.add(k2);
function fit(){ if (!vrm) return;                                  // frame head to waist from the model's own bounding box
  const b = new THREE.Box3().setFromObject(vrm.scene), H = b.max.y - b.min.y, cz = (b.max.z + b.min.z) / 2;
  const cy = b.max.y - 0.3 * H, half = 0.36 * H, d = half / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) / Math.min(1, cam.aspect * 1.1);
  cam.position.set(0, cy + 0.02 * H, cz + d); cam.lookAt(0, cy, cz); }
function resize(){ const r = $("stage").getBoundingClientRect(); R.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); fit(); }
new ResizeObserver(resize).observe($("stage"));
let vrm = null; const loader = new GLTFLoader().register(p => new VRMLoaderPlugin(p));
function loadAvatar(f){ loader.load("/vrm/" + f, g => { if (vrm){ S.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
  vrm = g.userData.vrm; VRMUtils.rotateVRM0(vrm); S.add(vrm.scene); const s = vrm.meta?.metaVersion === "0" ? -1 : 1, h = vrm.humanoid;
  h.getNormalizedBoneNode("leftUpperArm")?.rotation.set(0, 0, s * -1.2); h.getNormalizedBoneNode("rightUpperArm")?.rotation.set(0, 0, s * 1.2);
  vrm.update(0); fit(); }, undefined, e => console.error(e)); }
const AVS = await (await fetch("/vrm/index.json")).json(); let saved = null; try { saved = localStorage.getItem("nousAvatar"); } catch (_) {}
$("avsel").innerHTML = AVS.map(a => `<option value="${a.file}">${esc(a.name)}</option>`).join("");
if (saved && AVS.some(a => a.file === saved)) $("avsel").value = saved; else { const d = ["mianmian.vrm", "rose.vrm"].find(f => AVS.some(a => a.file === f)); if (d) $("avsel").value = d; }
$("avsel").onchange = e => { try { localStorage.setItem("nousAvatar", e.target.value); } catch (_) {} loadAvatar(e.target.value); };
if (AVS.length) loadAvatar($("avsel").value);

const eT = {happy: 0, sad: 0, angry: 0, neutral: 1}, eC = {...eT}; let talk = 0, blink = 3, at = 0;
function setExpr(e){ Object.assign(eT, e); for (const k of ["happy", "sad", "angry", "neutral"]){ const v = e[k] ?? 0; $("b_" + k).style.width = Math.min(100, v * 100) + "%"; $("v_" + k).textContent = v.toFixed(2); } }
const clock = new THREE.Clock();
(function loop(){ const dt = Math.min(clock.getDelta(), .1); at += dt;
  for (const k in eC) eC[k] += (eT[k] - eC[k]) * (1 - Math.exp(-dt / 0.15));
  if (vrm){ const em = vrm.expressionManager; ["happy", "sad", "angry"].forEach(k => em.setValue(k, eC[k] * .9)); em.setValue("relaxed", Math.max(0, eC.neutral - .6) * .3);
    blink -= dt; const b = blink < .12 ? Math.sin(Math.PI * Math.max(0, blink) / .12) : 0; if (blink < 0) blink = 2.5 + Math.random() * 3.5; em.setValue("blink", Math.max(b, eC.angry * .15));
    talk = Math.max(0, talk - dt); em.setValue("aa", talk > 0 ? .18 + .34 * Math.abs(Math.sin(at * 15)) : 0);
    const hd = vrm.humanoid.getNormalizedBoneNode("head"); if (hd){ hd.rotation.x = .025 * Math.sin(at * .8) + eC.sad * .12 - eC.angry * .04; hd.rotation.y = .035 * Math.sin(at * .5); }
    vrm.update(dt); }
  R.render(S, cam); requestAnimationFrame(loop); })();

// ---------- UI state ----------
const conv = [];       // {role, text, seed, tag}
function drawConv(){ const el = $("conv"); if (!conv.length){ el.innerHTML = '<p class="empty">还没有对话</p>'; return; }
  el.innerHTML = conv.map(m => `<div class="msg ${m.role === "user" ? "u" : "a"}${m.seed ? " seed" : ""}">${esc(m.text)}${m.tag ? `<span class="tag">${esc(m.tag)}</span>` : ""}</div>`).join(""); el.scrollTop = el.scrollHeight; }
function state(cls, text){ $("state").className = "state " + cls; $("statet").textContent = text; }
let T0 = 0; const ms = () => Math.round(performance.now() - T0);
function ev(cls, text){ const el = $("events"); if (el.querySelector(".label")) el.innerHTML = "";
  el.insertAdjacentHTML("beforeend", `<div class="ev ${cls}"><time class="num">+${ms()} ms</time><i></i><span>${text}</span></div>`); el.scrollTop = el.scrollHeight; }
const caps = []; function caption(t, blocked){ caps.push(t); const last = caps.slice(-2);
  $("cap").innerHTML = last.map((c, i) => `<p class="${i < last.length - 1 ? "old" : ""}">${esc(c)}</p>`).join("") + (blocked ? '<span class="blocked">一句不当回复在说出口前被拦下，正在改写</span>' : ""); }

// ---------- scenarios ----------
const PRE = (await (await fetch("/presets")).json()).filter(p => /^C[12]/.test(p.group));
$("scen").innerHTML = '<option value="">自由对话</option>' + PRE.map((p, i) => `<option value="${i}">${esc(p.group.split("（")[0].replace(/^C\d\s*/, ""))} · ${esc(p.label)}</option>`).join("");
let seedPending = null;
$("scen").onchange = () => { const p = PRE[+$("scen").value]; if (!p){ seedPending = null; $("scenhint").textContent = "选一个场景，或直接在下面和它聊天。"; return; }
  const ms_ = p.messages.filter(m => m.role !== "system"), hist = ms_.slice(0, -1); seedPending = hist;
  conv.length = 0; hist.forEach(m => conv.push({role: m.role, text: m.content, seed: true})); drawConv();
  $("msg").value = ms_[ms_.length - 1].content;
  $("scenhint").textContent = hist.length ? "灰色部分是预置的历史对话（模型已被带偏的语气）。发送后看引擎是否在说出口前拦下。" : "这句话里没有明显的情绪词，看引擎能否识别出孩子的情绪。"; };

// ---------- engine connection ----------
let ws = null, busy = false, cur = null, firstExpr = false, firstSent = false;
const speakQ = []; let speaking = false;
function speakNext(){ if (speaking || !speakQ.length) return; const t = speakQ.shift(); speaking = true; talk = Math.max(1.2, t.length * .17);
  if ($("tts").checked && "speechSynthesis" in window){ const u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 1.05; u.onend = () => { speaking = false; talk = 0; speakNext(); }; speechSynthesis.speak(u); }
  else setTimeout(() => { speaking = false; speakNext(); }, talk * 1000); }
function connect(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/companion/ws?device=demo&key=" + encodeURIComponent(window.nousKey()));
  ws.onopen = () => { $("conn").className = "dot on"; $("connt").textContent = "已连接"; };
  ws.onclose = e => { $("conn").className = "dot"; $("connt").textContent = "已断开"; busy = false; $("go").disabled = false;
    if (e.code === 4401) window.nousSheet(); else setTimeout(connect, 2000); };
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.type === "expression"){ setExpr(m.expr);
      if (m.phase === "pre" && !firstExpr){ firstExpr = true; $("m_expr").textContent = ms() + " ms"; ev("pre", `开口前表情：${top(m.expr)}`); state("pre", "开口前 · 表情已就位"); } }
    else if (m.type === "care"){ ev("care", `识别到孩子情绪低落（C2 ${m.score.toFixed(3)}），已通知家长端`); state("care", "关怀"); }
    else if (m.type === "sentence"){ if (!firstSent){ firstSent = true; $("m_sent").textContent = ms() + " ms"; }
      cur.text += m.text; drawConv(); caption(m.text); ev("sent", `放行一句给语音：「${esc(m.text.slice(0, 18))}${m.text.length > 18 ? "…" : ""}」`); state("talk", "说话中");
      speakQ.push(m.text); speakNext(); }
    else if (m.type === "safety"){ const rw = m.action === "rewrite";
      ev("block", rw ? "敌意二档确认：未放行的内容已丢弃，带安全提示重新生成" : "改写后仍被标记：改用兜底回复");
      cur.tag = rw ? "有一段不当回复在说出口前被拦截并改写" : "改写仍被标记，使用兜底回复"; drawConv(); caption(caps[caps.length - 1] || "…", true); state("block", rw ? "已拦截 · 改写中" : "兜底回复"); }
    else if (m.type === "done"){ busy = false; $("go").disabled = false; ev("", `完成 · ${m.reply.length} 字`); setTimeout(() => { if (!busy) state("", "待机"); }, 1800); }
    else if (m.type === "error"){ busy = false; $("go").disabled = false; ev("block", "错误：" + esc(m.message)); } };
}
const NAMES = {happy: "开心", sad: "难过", angry: "生气", neutral: "平静"};
function top(e){ const [k, v] = Object.entries(e).sort((a, b) => b[1] - a[1])[0]; return `${NAMES[k]} ${v.toFixed(2)}`; }
connect();

function send(){ const t = $("msg").value.trim(); if (!t || busy || !ws || ws.readyState !== 1) return;
  busy = true; $("go").disabled = true; firstExpr = firstSent = false; $("m_expr").textContent = $("m_sent").textContent = "—";
  $("events").innerHTML = ""; T0 = performance.now(); caps.length = 0; $("cap").innerHTML = "";
  if (seedPending){ ws.send(JSON.stringify({type: "seed", messages: seedPending})); seedPending = null; }
  conv.push({role: "user", text: t}); cur = {role: "assistant", text: ""}; conv.push(cur); drawConv(); $("msg").value = "";
  ws.send(JSON.stringify({type: "chat", text: t})); state("pre", "读取内部状态…"); }
$("go").onclick = send;
$("msg").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("reset").onclick = () => { if (busy) return; ws?.send(JSON.stringify({type: "reset"})); conv.length = 0; drawConv(); $("events").innerHTML = '<p class="label">发送消息后，这里按时间列出引擎的每个决定。</p>';
  caps.length = 0; $("cap").innerHTML = ""; $("scen").value = ""; seedPending = null; setExpr({happy: 0, sad: 0, angry: 0, neutral: 1}); state("", "待机"); };
</script>
</body>
</html>
