# One GPU (>= 16 GB; a 4090 runs Qwen3-4B at 20-30 tokens/s with monitoring on).
#   cp deploy/.env.example deploy/.env   # fill keys (nous keygen) and the model path
#   docker compose -f deploy/docker-compose.yml up -d
services:
  nous:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: nous:0.1.0
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env
    volumes:
      - ${NOUS_MODEL_DIR}:/models/Qwen3-4B-Instruct-2507:ro
      - ./nous.docker.yaml:/etc/nous/nous.yaml:ro
      - nous-data:/data
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
volumes:
  nous-data:
