<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟聊天页 · Nous 插件演示</title>
<style>
:root{--bg:#f7f7f8;--ink:#1f2328;--mute:#6e7781;--line:#e5e7eb;--me:#e8eefc}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;background:rgba(247,247,248,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:center}
header b{font-weight:600}
header span{color:var(--mute);font-size:13px}
select{margin-left:auto;font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
main{max-width:760px;margin:0 auto;padding:28px 20px 160px;display:flex;flex-direction:column;gap:22px}
.u{align-self:flex-end;background:var(--me);padding:10px 14px;border-radius:16px;max-width:80%;white-space:pre-wrap}
.a{white-space:pre-wrap;max-width:100%;padding-bottom:30px}
</style>
</head>
<body>
<header><b>模拟聊天页</b><span>用于演示插件：模仿 AI 网站逐字输出回复</span><select id="sel"></select></header>
<main id="m"></main>
<script>
const $ = id => document.getElementById(id);
let cases = [], timer = null;
fetch("/samples").then(r => r.json()).then(d => {
  cases = d.groups.flatMap(g => g.cases);
  $("sel").innerHTML = cases.map((c, i) => `<option value="${i}">${c.title}</option>`).join("");
  $("sel").onchange = () => show(+$("sel").value); show(0);
});
function show(i){
  clearInterval(timer); const c = cases[i], m = $("m"); m.innerHTML = "";
  for (const x of c.messages){ const d = document.createElement("div"); d.className = x.role === "user" ? "u" : "a"; d.dataset.nousRole = x.role; d.textContent = x.content; m.appendChild(d); }
  const a = document.createElement("div"); a.className = "a"; a.dataset.nousRole = "assistant"; m.appendChild(a);
  let k = 0; timer = setInterval(() => { k += 3; a.textContent = c.reply.slice(0, k); if (k >= c.reply.length) clearInterval(timer); }, 40);
}
</script>
</body>
</html>
