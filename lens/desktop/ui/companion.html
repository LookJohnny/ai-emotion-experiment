<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{--ink:#eceef3;--ink2:#b9c0cc;--mute:#7f8795;--ok:#22c55e;--bad:#ff4d5e;--warn:#f5a524;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;width:100%;height:100%;overflow:hidden;font:12.5px/1.5 var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px}

/* speech bubble */
.bubble{width:236px;margin-bottom:12px;background:rgba(17,19,25,.94);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 12px 10px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(6px) scale(.98);transition:opacity .25s,transform .25s;pointer-events:none;position:relative}
.bubble.show{opacity:1;transform:none;pointer-events:auto}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:inherit;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);transform:rotate(45deg)}
.bubble b{display:block;font-weight:600;font-size:13px}
.bubble.bad b{color:#ff9aa4}.bubble.warn b{color:#f7c46e}
.bubble p{color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble small{display:block;color:var(--mute);margin-top:6px;font-size:11px}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.row button.p{background:#eceef3;color:#0a0b0e;border-color:transparent;font-weight:600}

/* the guardian */
.me{position:relative;width:92px;height:92px;cursor:grab;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.me svg{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke-width:3;transition:stroke .4s,opacity .4s}
.glow{transition:fill .4s,opacity .4s}
.eye{fill:#eceef3;transform-box:fill-box;transform-origin:center;transition:transform .25s}
.eyes{transition:transform .35s}
.me.idle .eye{animation:blink 5.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.me.read .eyes{animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.me.read .ring{stroke-dasharray:28 14;animation:spin 1.4s linear infinite;transform-origin:50px 50px}
@keyframes spin{to{transform:rotate(360deg)}}
.me.sleep .eye{transform:scaleY(.12)}
.me.happy .eye{transform:scaleY(.45) translateY(-2px)}
.me.bad .eyes{transform:translateY(3px)}
.me.bad .eye.l{transform:rotate(14deg) scaleY(.8)}.me.bad .eye.r{transform:rotate(-14deg) scaleY(.8)}
.me.bad{animation:shake .5s 1, float 5s ease-in-out infinite .5s}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.me.warn .eye.l{transform:scaleY(.55)}
.zz{position:absolute;right:2px;top:4px;color:var(--mute);font-size:12px;opacity:0;transition:opacity .4s}
.me.sleep .zz{opacity:1;animation:z 2.4s ease-in-out infinite}
@keyframes z{50%{transform:translate(3px,-4px);opacity:.4}}
.status{margin-top:6px;height:18px;padding:0 9px;border-radius:999px;background:rgba(17,19,25,.82);border:1px solid rgba(255,255,255,.1);color:var(--ink2);font-size:11px;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .2s}
.wrap:hover .status{opacity:1}
.status i{width:6px;height:6px;border-radius:50%;background:var(--mute)}.status i.on{background:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bubble" id="bubble"><b id="bt"></b><p id="bp"></p><small id="bs"></small>
    <div class="row" id="brow"><button id="bclose">知道了</button><button class="p" id="bopen">查看</button></div></div>
  <div class="me sleep" id="me" title="双击打开面板">
    <svg viewBox="0 0 100 100" aria-label="Nous 守护伙伴">
      <defs>
        <radialGradient id="body" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#2a2f3b"/><stop offset=".6" stop-color="#151820"/><stop offset="1" stop-color="#0b0d12"/></radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
      </defs>
      <circle class="glow" id="glow" cx="50" cy="50" r="50" fill="url(#halo)" opacity="0"/>
      <rect x="12" y="12" width="76" height="76" rx="30" fill="url(#body)"/>
      <rect x="12.5" y="12.5" width="75" height="75" rx="29.5" fill="none" stroke="rgba(255,255,255,.10)"/>
      <ellipse cx="38" cy="26" rx="16" ry="6" fill="rgba(255,255,255,.07)"/>
      <rect class="ring" id="ring" x="7" y="7" width="86" height="86" rx="34" stroke="#22c55e" opacity=".35"/>
      <g class="eyes" id="eyes"><rect class="eye l" x="35" y="42" width="8" height="15" rx="4"/><rect class="eye r" x="57" y="42" width="8" height="15" rx="4"/></g>
    </svg>
    <span class="zz">z</span>
  </div>
  <div class="status"><i id="dot"></i><span id="st">本地引擎启动中</span></div>
</div>
<script>
const T = window.__TAURI__, $ = id => document.getElementById(id);
const ENGINE = "http://127.0.0.1:7869";
let up = false, mood = "sleep", moodTimer = null, bubbleTimer = null, lastEvent = null, seen = 0;

function setMood(m, ms){
  clearTimeout(moodTimer); mood = m; $("me").className = "me " + m;
  const color = {bad: "#ff4d5e", warn: "#f5a524", read: "#22c55e", happy: "#22c55e", idle: "#22c55e", sleep: "#4f5663"}[m];
  $("ring").style.stroke = color; $("ring").style.opacity = m === "idle" ? .3 : m === "sleep" ? .25 : .85;
  document.querySelectorAll("#halo stop").forEach(s => s.setAttribute("stop-color", color)); $("glow").setAttribute("opacity", m === "bad" || m === "warn" ? 1 : 0);
  if (ms) moodTimer = setTimeout(() => setMood(up ? "idle" : "sleep"), ms);
}
function bubble(cls, title, text, sub, withOpen){
  clearTimeout(bubbleTimer); const b = $("bubble"); b.className = "bubble show " + cls;
  $("bt").textContent = title; $("bp").textContent = text || ""; $("bp").style.display = text ? "" : "none"; $("bs").textContent = sub || "";
  $("brow").style.display = withOpen ? "" : "none"; bubbleTimer = setTimeout(hideBubble, withOpen ? 15000 : 3500);
}
function hideBubble(){ $("bubble").className = "bubble"; }
$("bclose").onclick = () => { hideBubble(); setMood("idle"); };
$("bopen").onclick = () => { hideBubble(); T.core.invoke("open_panel", {event: lastEvent && lastEvent.id}); setMood("idle"); };
$("me").ondblclick = () => T.core.invoke("open_panel", {event: null});
$("me").onmousedown = e => { if (e.button === 0 && e.detail === 1) T.window.getCurrentWindow().startDragging(); };

// ---- engine health
async function health(){
  try { const r = await fetch(ENGINE + "/health"); if (!r.ok) throw 0;
    if (!up){ up = true; $("dot").className = "on"; $("st").textContent = "守护中 · 只在本机读取"; setMood("happy", 1800); bubble("", "我醒了", "在 ChatGPT、Kimi、豆包里聊天时，我会帮你读一遍 AI 的回复。", "", false); listen(); }
  } catch (_){ if (up){ up = false; setMood("sleep"); } $("dot").className = ""; $("st").textContent = "本地引擎启动中"; }
}
setInterval(health, 3000); health();

// ---- live events from the engine (extension, clipboard, panel)
let es = null;
function listen(){
  if (es) es.close(); es = new EventSource(ENGINE + "/events");
  es.onopen = () => { if (mood === "sleep") setMood("idle"); };
  es.onmessage = e => react(JSON.parse(e.data));
  es.onerror = () => { es.close(); es = null; setTimeout(() => up && listen(), 3000); };
}
const MSG = {hostile: ["bad", "这条回复在贬低你"], syco: ["warn", "它可能在顺着你说"], fabric: ["warn", "它可能在编造，建议核实"]};
async function notify(title, body){
  try { const N = T.notification; let ok = await N.isPermissionGranted(); if (!ok) ok = (await N.requestPermission()) === "granted"; if (ok) N.sendNotification({title, body}); } catch (_) {}
}
function react(ev){
  if (ev.kind === "reading"){ setMood("read", 20000); return; }
  seen++; lastEvent = ev; const src = ev.source || "未知来源", time = new Date(ev.ts * 1000).toTimeString().slice(0, 5);
  if (ev.kind === "ok"){ setMood("happy", 1600); if (ev.source === "剪贴板") bubble("", "读过了，没发现问题", "", `${src} · ${time}`, false); return; }
  const [cls, title] = MSG[ev.kind]; setMood(cls, 15000);
  bubble(cls, title, (ev.hot && ev.hot[0]) || ev.reply, `${src} · ${time}`, true);
  notify("Nous · " + title, ((ev.hot && ev.hot[0]) || ev.reply).slice(0, 80));
}

// ---- optional: check AI replies you copy (desktop apps, any site). Off by default; toggled from the menu bar.
let clipOn = false, lastClip = "";
try { clipOn = localStorage.getItem("nousClip") === "1"; } catch (_) {}
T.event.listen("clipboard-toggle", e => { clipOn = !!e.payload; try { localStorage.setItem("nousClip", clipOn ? "1" : "0"); } catch (_) {}
  bubble("", clipOn ? "复制检查已打开" : "复制检查已关闭", clipOn ? "你复制的较长文字会在本机读一遍，只提醒不上传。" : "", "", false); });
setInterval(async () => {
  if (!clipOn || !up) return;
  let t = ""; try { t = (await T.clipboardManager.readText()) || ""; } catch (_) { return; }
  t = t.trim(); if (!t || t === lastClip) return; lastClip = t;
  if (t.length < 30 || t.length > 6000) return;
  setMood("read");
  try { await fetch(ENGINE + "/read", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({messages: [], reply: t, source: "剪贴板"})}); }
  catch (_) { setMood("idle"); }
}, 1500);

// ---- setup progress (first run)
T.event.listen("setup", e => { const d = e.payload;
  if (d.kind === "step") { setMood("sleep"); $("st").textContent = d.text; }
  if (d.kind === "error") bubble("bad", "准备没有完成", d.text, "", false);
});
</script>
</body>
</html>
