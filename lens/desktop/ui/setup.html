<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root{--bg:#0a0b0e;--panel:#111319;--line:rgba(255,255,255,.08);--ink:#eceef3;--ink2:#b9c0cc;--mute:#7f8795;--ok:#22c55e;--bad:#ff4d5e;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;--sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);-webkit-user-select:none;user-select:none}
main{padding:28px 30px;display:flex;flex-direction:column;height:100%}
.brand{display:flex;align-items:center;gap:10px;font:22px "Times New Roman",serif}
.g{width:24px;height:24px;border-radius:7px;background:var(--ok);color:#fff;display:grid;place-items:center;font:600 12px var(--sans)}
h1{font:400 26px "Times New Roman",serif;margin-top:22px}
.sub{color:var(--mute);margin-top:6px}
.steps{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.s{display:flex;align-items:center;gap:10px;color:var(--mute)}
.s i{width:16px;height:16px;border-radius:50%;border:2px solid #2a2f3b;flex:0 0 auto}
.s.on{color:var(--ink)}.s.on i{border-color:var(--ink);border-top-color:transparent;animation:r .8s linear infinite}
.s.done{color:var(--ink2)}.s.done i{border-color:var(--ok);background:var(--ok)}
@keyframes r{to{transform:rotate(1turn)}}
.log{margin-top:auto;height:92px;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:11px/1.55 var(--mono);color:var(--mute);white-space:pre}
.err{margin-top:14px;color:#ff9aa4;display:none}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="g">N</span>Nous 知情助手</div>
  <h1>第一次使用，正在本机做准备</h1>
  <p class="sub">所有读取都在这台电脑上完成。下载只需一次，之后打开即用。</p>
  <div class="steps">
    <div class="s" id="s1"><i></i>准备运行环境</div>
    <div class="s" id="s2"><i></i>安装组件（约 3–10 分钟）</div>
    <div class="s" id="s3"><i></i>下载本地模型 Qwen3-4B（约 8 GB）</div>
    <div class="s" id="s4"><i></i>启动守护</div>
  </div>
  <p class="err" id="err"></p>
  <div class="log" id="log"></div>
</main>
<script>
const T = window.__TAURI__, $ = id => document.getElementById(id), lines = [];
function mark(n){ for (let i = 1; i <= 4; i++) $("s" + i).className = "s" + (i < n ? " done" : i === n ? " on" : ""); }
mark(1);
T.event.listen("setup", e => { const d = e.payload;
  if (d.kind === "step") mark(+d.text[0] || 1);
  if (d.kind === "done") mark(4);
  if (d.kind === "error"){ $("err").style.display = "block"; $("err").textContent = d.text; document.querySelector(".s.on")?.classList.remove("on"); }
  if (d.kind === "log"){ const t = d.text.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "").trim(); if (!t) return;
    if (lines.length && /%\|/.test(t) && /%\|/.test(lines[lines.length - 1])) lines[lines.length - 1] = t; else lines.push(t);
    while (lines.length > 6) lines.shift(); $("log").textContent = lines.join("\n"); }
});
</script>
</body>
</html>
